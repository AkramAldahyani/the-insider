# Every folder under packages/ is a workspace package.
# engine, cli, shared, server, client.
packages:
  - "packages/*"

# esbuild (used by tsx, vitest and vite) is the only dependency allowed to run an install script.
# msgpackr-extract is an optional speed-up for Colyseus that compiles native code; the game works without it.
allowBuilds:
  esbuild: true
  msgpackr-extract: false
